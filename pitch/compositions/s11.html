      var W = 2160, VW = 1210, VH = 756, BASE = VW / W;
      var OPEN = [935, 1106, 291, 92];
      var tl = gsap.timeline({ paused: true });
      var camAt = { x: 0, y: 0, scale: BASE };
      function cam(at, cx, cy, z, dur) {
        var s = BASE * z, H = 1350;

      // ---- deterministic drawing of the cell layers ----
      var NS = "http://www.w3.org/2000/svg";
      function el(parent, tag, attrs) {

        parent.appendChild(e);
        return e;
      }
      var h = function (i) { return ((i * 2654435761) >>> 0) % 1000 / 1000; };
      // palisade cells seen from above: rounded columns with chloroplasts
      var cells = document.getElementById("s11-cells");
      for (var r = 0; r < 5; r++) {
        for (var c = 0; c < 9; c++) {
          var x = 14 + c * 47 + (r % 2) * 20, y = 14 + r * 56;
          el(cells, "rect", { x: x, y: y, width: 40, height: 48, rx: 18, fill: "#c9e3d4", stroke: "#89b6a1", "stroke-width": 2 });
          for (var k = 0; k < 4; k++) {

      }
      var spongy = document.getElementById("s11-spongy");
      for (var i = 0; i < 34; i++) {
        el(spongy, "ellipse", { cx: 24 + h(i) * 392, cy: 22 + h(i + 77) * 256, rx: 18 + h(i + 5) * 14, ry: 13 + h(i + 9) * 10 });
      }
      var spe = document.getElementById("s11-spe");
      for (var j = 0; j < 12; j++) el(spe, "ellipse", { cx: 18 + j * 37 + h(j) * 8, cy: 20 + (j % 2) * 28, rx: 16, ry: 12 });
      var st = document.getElementById("s11-stomata");
      [[107, 70], [257, 150], [391, 230], [60, 220], [190, 40], [330, 80]].forEach(function (p) {
