    <!--
      Presenter navigation. The slideshow navigates by seeking, which jumps straight
      to each hold. Only when this deck runs inside <hyperframes-slideshow>
      (hyperframes present) do we adjust two things on its controller:
      - Moving forward plays the authored motion up to the next hold, starting from
        wherever the playhead is, so an early click continues instead of breaking.
      - Back steps exactly one hold back (into the previous slide's last step).
      Studio, check, snapshot and render never take this path.
    -->
    <script>
      (function () {
        var host = null;
        try {
          host = window.parent !== window && window.parent.document.querySelector("hyperframes-slideshow");
        } catch (e) {}
        if (!host) return;

        function patch(c) {
          if (!c || c.__morphNav) return;
          c.__morphNav = true;
          var seek = c.playTo.bind(c);
          var origPrev = c.prev.bind(c);
          var proxy = { t: 0 };
          var anim = null;
          var current = null;
          var backward = false;
          // prefers-reduced-motion: jump straight to each step instead of playing it
          var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

          c.playTo = function (t) {
            if (anim) anim.kill();
            anim = null;
            var slide = c.currentSlide;
            var from = null;
            if (!backward && slide && current !== null && !document.hidden && !reduced.matches) {
              if (current >= slide.start && current < t) from = current; // same slide: continue from here
              else if (current < slide.start) from = slide.start; // next slide: play its entrance
            }
            if (from === null || t - from < 0.02) {
              current = t;
              seek(t);
              return;
            }
            proxy.t = current = from;
            seek(from);
            anim = gsap.to(proxy, {
              t: t,
              duration: t - from,
              ease: "none",
              onUpdate: function () {
                current = proxy.t;
                seek(proxy.t);
              },
              onComplete: function () {
                anim = null;
                current = t;
                seek(t);
              },
            });
          };

          c.prev = function () {
            backward = true;
            try {
              var f = c.frame;
              var slide = c.currentSlide;
              if (slide && f.fragmentIndex > 0) {
                f.fragmentIndex -= 1;
                c.playTo(slide.fragments[f.fragmentIndex]);
                c.emitChange();
                return;
              }
              if (f.slideIndex > 0) {
                var prevSlide = c.slidesOf(f.sequenceId)[f.slideIndex - 1];
                c.stopSlideMedia();
                c.resumeSlide(f.slideIndex - 1, prevSlide.fragments.length ? prevSlide.fragments.length - 1 : -1);
                return;
              }
              origPrev();
            } finally {
              backward = false;
            }
          };
        }

        // The controller is created once the player is ready (and again on reload).
        gsap.ticker.add(function () {
          patch(host.controller);
        });
      })();
    </script>
